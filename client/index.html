<!doctype html>
<html lang="en" style="margin: 0; padding: 0; height: 100%; width: 100%; overflow-x: hidden; background-color: #050a15;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="YourCodeMate — learn to code with an AI mentor, a multi-language IDE, real-time collaborative coding rooms, contests, and gamified progress." />
    <meta name="theme-color" content="#050a15" />
    <meta name="color-scheme" content="dark light" />

    <!-- Social / Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="YourCodeMate — Master Coding with AI" />
    <meta property="og:description" content="AI mentor, live collaborative IDE, contests, and gamified learning for new coders." />
    <meta name="twitter:card" content="summary_large_image" />

    <title>YourCodeMate — Master Coding with AI</title>

    <!-- Design-system fonts (Inter + Fira Code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fira+Code:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
        position: relative;
      }
      #root {
        margin: 0;
        padding: 0;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
        position: relative;
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; top: 0; left: 0;">
    <div id="root" style="margin: 0; padding: 0; top: 0; left: 0;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
